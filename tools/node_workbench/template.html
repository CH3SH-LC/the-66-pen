<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>千星节点分组与功能簇</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e8edf2;background:#11161e}*{box-sizing:border-box}body{margin:0}header{padding:24px 30px;background:#19232f;border-bottom:1px solid #354553}h1{font-size:25px;margin:0 0 10px}p{line-height:1.7;margin:9px 0}small,.muted{color:#a9b9c8}a{color:#80d9cc}input,select,button{font:inherit;color:inherit;background:#222e3c;border:1px solid #506174;border-radius:5px;padding:9px}input{min-width:230px;flex:1}.filters{display:flex;gap:8px;margin-top:17px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 236px);min-height:480px}nav{overflow:auto;border-right:1px solid #354553;padding:10px}nav button{display:block;width:100%;text-align:left;margin:5px 0;border-color:transparent;cursor:pointer}nav button.active{border-color:#66d5bd;background:#254038}main{overflow:auto;padding:24px 32px}h2{margin:0 0 10px}h3{font-size:16px;margin-top:26px}.badge{display:inline-block;margin:3px 6px 3px 0;padding:4px 9px;border-radius:4px;background:#243549;font-size:12px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #334252}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#19232f;padding:14px;border-radius:6px;font-size:12px;line-height:1.6}details{margin:12px 0}summary{cursor:pointer;color:#80d9cc}.notice{border-left:3px solid #d8b568;padding-left:13px}.stats{display:flex;gap:20px;flex-wrap:wrap}.stat strong{color:#80d9cc;font-size:23px;margin-right:7px}.sub{display:block;font-size:11px;color:#a9b9c8;margin-top:5px}@media(max-width:850px){.layout{grid-template-columns:260px 1fr}main{padding:18px}header{padding:20px}td,th{padding:7px}}@media(max-width:600px){.layout{display:block;height:auto}nav{max-height:280px}main{overflow:visible}}
</style><header><h1>千星节点分组与功能簇</h1><div class="stats" id="stats"></div><p class="muted">先选节点分组，再选功能簇。按任务定位商店、交互、背包或技能，最后查看具体节点写法。<a href="../../tools/node_workbench/EXPLORATION-GUIDE.md">DS通用探索手册：读懂端口、枚举并设计实验</a></p><div class="filters"><input id="query" placeholder="搜索节点、功能、编号，例如：选项卡"><select id="kind"><option value="">全部图类别</option></select><select id="family"><option value="">第一层：全部节点分组</option></select><select id="cluster"><option value="">第二层：全部功能簇</option></select><button id="overview">分组总览</button><button id="special">外部资产 / 复合节点</button></div></header>
<div class="layout"><nav><small id="count"></small><div id="list"></div></nav><main id="detail"></main></div>
<script type="application/json" id="data">/*__CATALOG__*/</script><script>
'use strict';const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),el=(tag,text,parent)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n;};
const SEARCH=D.nodes.map(n=>JSON.stringify([n.name,n.definitionId,n.keywords,n.menuPaths,n.official.map(d=>d.function)]).toLowerCase());
for(const [v,l] of [[D.stats.definitions,'节点定义'],[D.stats.variants,'分类变体'],[D.stats.ports,'端口'],[D.stats.enumGroups,'枚举表']]){const s=el('div',undefined,$('stats'));s.className='stat';el('strong',v,s);el('span',l,s);}
for(const k of Object.keys(D.stats.byGraphKind))el('option',`${k} · ${D.stats.byGraphKind[k]} 个`,$('kind')).value=k;
for(const g of D.discovery.groups)el('option',`${g.name} · ${g.count}`,$('family')).value=g.name;
function clusters(){const f=$('family').value,prior=$('cluster').value;$('cluster').replaceChildren();el('option','第二层：全部功能簇',$('cluster')).value='';for(const c of D.discovery.clusters.filter(c=>!f||c.byFamily[f]))el('option',`${c.name} · ${f?c.byFamily[f]:c.count}`,$('cluster')).value=c.id;if([...$('cluster').options].some(o=>o.value===prior))$('cluster').value=prior;}clusters();
function jsonDetails(parent,title,value){const d=el('details',undefined,parent);el('summary',title,d);el('pre',JSON.stringify(value,null,2),d);}
function show(n){const m=$('detail');m.replaceChildren();el('h2',n.name,m);for(const t of [n.family,`类别 ${n.graphKind}`,`定义 ${n.definitionId}`,n.menuPaths.length?'菜单已对应':'已注册 · 菜单未列出'])el('span',t,m).className='badge';
el('p','已读到定义与原生资源；本目录不把这些证据标记为逐节点试玩通过。',m).className='notice';
el('h3','功能与适用范围',m);if(n.official.length){for(const d of n.official){el('p',d.hierarchy.join(' / '),m).className='muted';for(const t of d.function)el('p',t,m);const a=el('a','官方功能与参数来源',m);a.href=d.url;a.target='_blank';a.rel='noreferrer';jsonDetails(m,'官方参数表（按原文保留）',d.parameterRows);}}else el('p',n.description||'当前定义没有功能说明；尚未匹配到该图类别的官方条目。名称和端口已完整保留，不补写猜测的功能。',m);
for(const p of n.menuPaths)el('p',p.path.join(' → '),m).className='muted';
el('h3','端口与参数写法',m);el('p','端口1=执行输入、2=执行输出、3=数据输入、4=数据输出；5为辅助口，普通连线未覆盖。声明类型的两个编号与存储类型、枚举表编号互不等同。',m).className='muted';const table=el('table',undefined,m),head=el('tr',undefined,table);for(const t of ['端口','名称','声明类型','常量 / 连线'])el('th',t,head);
for(const p of n.ports){const tr=el('tr',undefined,table),d=p.descriptor;el('td',p.key,tr);el('td',p.name||(p.kind===1||p.kind===2?'执行流':`未命名端口 ${p.key}`),tr);el('td',`${p.live.serverParamType}:${p.live.fbGKY8GZn68}`+(d?` · ${d.storageName}`:''),tr);const cell=el('td',undefined,tr);let help=p.kind===3?(d&&d.storageKind===10000?'泛型：先连接具体类型，再读取实例槽':d&&[1,2,3,4,5,6].includes(d.storageKind)?`候选槽 ${d.storageName}；写前读取实际 slots`:'容器或引用：查看类型结构和写入器支持范围'):'按端口 kind:index 连线';el('span',help,cell);if(d){jsonDetails(cell,'默认值 / 枚举 / 泛型 / 原始字段',d);}}
el('h3','创建与连线入口',m);el('pre',`python -B -m tools.node_workbench recipe ${n.definitionId} --graph-kind ${n.graphKind}\n\n原生 AddNode: ${D.writer.addNodeMethod}(definitionHandle, x, y, null, null)\n执行连线：2:index → 1:index；数据连线：4:index → 3:index\n先创建图并 lookup，随后 add；实际 nodeId 从读回取得。\n写值前读取 slots；资源描述不能代替实例的泛型物化状态。`,m);
if(n.dynamicPortsRaw.length)el('p','此节点有动态端口规则。当前没有通用动态端口扩展端点，不能把模板端口数量当成可任意写入的端口。',m).className='notice';
jsonDetails(m,'动态端口与内核选择规则',{dynamic:n.dynamicPortsRaw,kernel:n.kernelMappingRaw});jsonDetails(m,'资源与证据',{identity:n.key,resource:n.resource,live:D.evidence.live,classification:n.classificationRaw});}
function filter(){const q=$('query').value.trim().toLowerCase(),k=$('kind').value,f=$('family').value,c=D.discovery.clusters.find(c=>c.id===$('cluster').value);if(f==='节点外部资产'||f==='复合节点'){$('special').onclick();$('list').replaceChildren();$('count').textContent='资产机制 · 不属于内置节点';return;}const arr=D.nodes.filter((n,i)=>(!q||SEARCH[i].includes(q))&&(!k||String(n.graphKind)===k)&&(!f||n.family===f)&&(!c||c.nodeKeys.includes(n.key)));$('count').textContent=`${arr.length} 个结果`;$('list').replaceChildren();for(const n of arr){const b=el('button',n.name,$('list'));el('span',`${n.graphKind} / ${n.definitionId} · ${n.family}`,b).className='sub';b.onclick=()=>{for(const a of $('list').children)a.classList.remove('active');b.classList.add('active');show(n);};}if(c)showCluster(c);else if(arr.length)show(arr[0]);else $('detail').textContent='没有匹配的节点。';}
function showCluster(c){const m=$('detail');m.replaceChildren();el('h2',c.name,m);el('p',c.purpose,m);el('p','从左侧选节点查看真实端口与写法；切换分组可查看此功能的事件、执行和查询节点。',m).className='muted';if(c.sequence){el('h3','功能连接路线',m);const l=el('ol',undefined,m);for(const step of c.sequence)el('li',step,l);}if(c.pitfalls){el('h3','已知约束与踩坑',m);for(const t of c.pitfalls)el('p',t,m).className='notice';}el('h3','给 DS 的精简查询',m);el('pre',`python -B -m tools.node_workbench cluster ${c.id} --graph-kind 20000\npython -B -m tools.node_workbench route "${c.name}"`,m);if(c.code)for(const path of c.code)el('p',path,m);el('h3','原生菜单来源',m);el('p',(c.nativeLeaves||[]).join(' / ')||'跨功能簇组合路线',m);}
function overview(){const m=$('detail');m.replaceChildren();el('h2','第一层 · 节点分组',m);el('p','先按动作、事件、查询等选择分组，再进入功能簇。也可以在第二层直接选跨组玩法路线。',m);for(const g of D.discovery.groups){const b=el('button',`${g.name} · ${g.count}`,m);b.style.margin='8px';b.onclick=()=>{$('family').value=g.name;clusters();filter();if(g.builtin){m.replaceChildren();el('h2',g.name+' → 选择功能簇',m);el('p',g.purpose,m);for(const c of g.clusters){const x=el('button',`${c.name} · ${c.count}`,m);x.style.margin='6px';x.onclick=()=>{$('cluster').value=c.id;filter();};}}};}el('h3','DS 入口（不会返回 929 份端口定义）',m);el('pre','python -B -m tools.node_workbench groups\npython -B -m tools.node_workbench group execute\npython -B -m tools.node_workbench route "靠近NPC打开商店"\npython -B -m tools.node_workbench cluster interaction --graph-kind 20000',m);el('p',D.discovery.limits.join('；'),m).className='muted';}
$('overview').onclick=overview;$('cluster').onchange=filter;$('query').oninput=filter;$('kind').onchange=filter;$('family').onchange=()=>{clusters();filter();};$('special').onclick=()=>{const m=$('detail');m.replaceChildren();el('h2','节点外部资产与复合节点',m);el('p','这两组的创建机制与内置节点不同，不能当成额外的内置 definitionId 使用。',m);for(const [title,v] of [['节点外部资产',D.writer.externalAssets],['复合节点',D.writer.composite]]){el('h3',title,m);el('p',v.constraint,m);el('p','已定位原生代码；自动导入 / 创建适配与游戏内验收尚未完成。',m).className='notice';jsonDetails(m,'实际原生入口、步骤与来源',v);}jsonDetails(m,'全量覆盖与待补项',{stats:D.stats,limits:D.limits,discrepancies:D.discrepancies});};filter();overview();
</script></html>
