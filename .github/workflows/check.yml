name: Offline distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -X utf8 -B scripts/audit.py
      - run: python -X utf8 -B -m unittest discover -s tests -v
      - run: python -X utf8 -B scripts/manifest.py --check
